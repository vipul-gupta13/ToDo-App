<!DOCTYPE html>
<html>
<head>
    <title>ToDo App</title>
    <style>
        body {
            background-color: {{ color }};
        }
    </style>
</head>
<body>
    <h1>ToDo List</h1>
    <form method="post">
        <input type="text" name="task" placeholder="Add new task">
        <input type="submit" value="Add">
    </form>
    <ul>
        {% for task in tasks %}
            <li>
                {{ task[1] }}
                <a href="{{ url_for('delete', task_id=task[0]) }}">Delete</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
