<html>
  <head>
    <title>Todo List</title>
  </head>
  <body>
    <h1>Todo List</h1>
    <form method='POST'>
      <input type='text' name='task' placeholder='Enter task'>
      <input type='submit' value='Add Task'>
    </form>
    <ul>
    {% for task in tasks %}
      <li>{{ task[1] }} <a href={{ url_for('delete', task_id=task[0]) }}>Delete</a></li>
    {% endfor %}
    </ul>
  </body>
</html>
